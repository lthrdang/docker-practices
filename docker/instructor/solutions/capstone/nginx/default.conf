# Reverse proxy in front of the API.
#
# nginx is the only service published to the host. The API, Postgres and Redis
# stay on internal networks -- that is the Day 4 isolation model, made real.

server {
    listen 80;
    server_name _;

    # --- Why this resolver line exists -------------------------------------
    #
    # 127.0.0.11 is Docker's embedded DNS server. Every container on a
    # user-defined network has it in /etc/resolv.conf. Look for yourself:
    #
    #     docker exec <container> cat /etc/resolv.conf
    #
    # Naming it explicitly here, combined with the $upstream variable below,
    # forces nginx to resolve "api" on every request instead of once at
    # startup.
    #
    # This matters the moment you run `docker compose up --scale api=3`.
    # With a plain `proxy_pass http://api:3000;` nginx resolves the name ONCE
    # when it starts, caches that single IP forever, and sends 100% of traffic
    # to one replica -- while you watch the other two sit idle and wonder why
    # scaling "does not work". It is working; nginx just is not looking again.
    #
    # valid=10s caps how long a resolved record is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # Using a variable in proxy_pass is what defers resolution to request
        # time. The cost: nginx no longer appends the request URI
        # automatically, so we do it ourselves with $request_uri.
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast while learning. Long timeouts turn "the API is on the wrong
        # network" into a 60-second hang instead of an immediate 502, and a
        # hang teaches you nothing.
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # nginx's own liveness, answered without touching the API. Lets you tell
    # "the proxy is down" apart from "the proxy is up but cannot reach the API"
    # -- which is exactly the distinction Day 4's break-and-fix drill trains.
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
