# This stack has SIX defects. Find them and fix them.
#
# They are all things covered this week. Two of them stop the stack working at
# all, three break something you have to test for, and one produces no runtime
# symptom whatsoever -- you find it by reading.
#
# You have 30 minutes. Do not rewrite the file from scratch; that defeats the
# exercise and you will miss the silent one.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      - api

  api:
    build: ../../labs/app-api
    environment:
      PGHOST: postgres
      PGUSER: app
      PGPASSWORD: SuperSecret123
      PGDATABASE: app
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - ../../labs/app-api:/app
      - shared-data:/data
    networks:
      - frontend
      - backend
    depends_on:
      - postgres
      - redis

  worker:
    build: ../../labs/app-worker
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - shared-data:/data
    networks:
      - frontend
    depends_on:
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: SuperSecret123
      POSTGRES_DB: app
    networks:
      - backend

  redis:
    image: redis:7-alpine
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  shared-data:

networks:
  frontend:
  backend:
